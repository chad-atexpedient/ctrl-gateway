[project]
name = "ctrl-gateway"
version = "2.0.0"
description = "Semantic gateway / transcoder / router for LLM inference fleets"
requires-python = ">=3.11"
license = "Apache-2.0"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line length handled by formatter; keep for now
    "B008",  # function calls in default args (aiohttp patterns)
    "UP042", # str+Enum dual inheritance is intentional (StringEnum)
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
