# Glint-V2 vertical taxonomy
# Each vertical has:
#   name: unique id
#   display: human-readable
#   description: short description used by router head and synthetic-data prompt
#   keywords: alias keywords (helps with synthetic data generation + OOD detection)
#   min_capability: 0-1, minimum capability score a tier must have for this vertical to qualify as "sufficient"
#   preferred_tiers: hint tiers (informational; cost-first still picks)
#   kind: "topic" (most verticals) | "structural" (allowed for prototypes — system_design etc.)
#   examples: 2-3 example queries used for synthetic data seed + adversarial pairs

verticals:

  - name: chat
    display: Casual Chat
    description: General conversational chat, greetings, small talk
    keywords: [hi, hello, hey, how are you, what's up, good morning]
    min_capability: 0.3
    preferred_tiers: [tier0]
    kind: topic
    examples:
      - "Hi how are you"
      - "Hello there"
      - "What's up?"

  - name: trivia
    display: Trivia / Fact Recall
    description: Simple factual Q&A, capitals, dates, definitions
    keywords: [what is, who is, when was, where is, capital of, definition]
    min_capability: 0.5
    preferred_tiers: [tier0, tier2]
    kind: topic
    examples:
      - "What is the capital of France?"
      - "Who wrote Hamlet?"
      - "What year did WWII end?"

  - name: freshness
    display: Freshness / Current Events
    description: Time-sensitive queries about current events, weather, news
    keywords: [today, current, latest, news, weather, breaking, this week]
    min_capability: 0.4
    preferred_tiers: [tier0]
    kind: topic
    examples:
      - "What is the weather in Paris?"
      - "Latest news about AI"
      - "What happened today in tech?"

  - name: formatting
    display: Formatting / Structure
    description: Reformating content (markdown, tables, lists, JSON structuring)
    keywords: [format, reformat, structure, markdown, table, json, csv]
    min_capability: 0.5
    preferred_tiers: [tier0, tier2]
    kind: topic
    examples:
      - "Format this as a markdown table"
      - "Convert to JSON"

  - name: summarization_simple
    display: Simple Summarization
    description: Summarize short documents (< 2K tokens) without analysis
    keywords: [summarize, tldr, brief, short version, key points]
    min_capability: 0.5
    preferred_tiers: [tier0, tier2]
    kind: topic
    examples:
      - "Summarize this article"
      - "TLDR this email"

  - name: summarization
    display: Complex Summarization
    description: Summarize long documents with analysis and key takeaways
    keywords: [comprehensive summary, executive summary, synthesize, key takeaways]
    min_capability: 0.7
    preferred_tiers: [tier2, tier3]
    kind: topic
    examples:
      - "Summarize this 50-page report into key themes"
      - "Synthesize these meeting notes"

  - name: translation_simple
