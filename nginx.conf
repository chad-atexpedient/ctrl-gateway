events { worker_connections 1024; }

http {
  # Docker embedded DNS: re-resolves the gateway service name on every request,
  # so `docker compose up --scale gateway=N` round-robins across all instances.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;

    location / {
      set $backend http://gateway:8076;
      proxy_pass $backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Streaming responses (SSE)
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    location /health {
      proxy_pass http://gateway:8076/health;
    }
  }
}
